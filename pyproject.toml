[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-to-music"
version = "0.3.0"
description = "代码生成配乐：D 小调科技解说视频铺底音乐 (score → MIDI → Surge XT / sfizz → pedalboard mix)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mido>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pedalboard>=0.9.8",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
musician = "musician.cli:main"

# uv: `uv sync` installs the project (editable) + deps from uv.lock; `uv sync --extra web` adds FastAPI/uvicorn.
# requirements*.txt are generated from uv.lock (`make requirements`) for plain-pip users — edit deps here, not there.
[tool.uv]
package = true

[tool.setuptools]
packages = ["src", "src.score", "src.render", "src.mix", "src.analyze", "src.feel", "src.web", "musician"]
