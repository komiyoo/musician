[project]
name = "code-to-music"
version = "0.3.0"
description = "代码生成配乐：D 小调科技解说视频铺底音乐 (score → MIDI → Surge XT / sfizz → pedalboard mix)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mido>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pedalboard>=0.9.8",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
musician = "musician.cli:main"

[tool.setuptools]
packages = ["src", "src.score", "src.render", "src.mix", "src.analyze", "src.feel", "src.web", "musician"]
